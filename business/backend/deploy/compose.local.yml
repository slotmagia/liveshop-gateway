name: liveshop-gateway-local

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      additional_contexts:
        protocol: ../../../../liveshop-platform/protocol
        kernel: ../../../../kernel-go
    command: ["-config", "/app/configs/gateway.compose.yaml"]
    ports: ["127.0.0.1:18081:18081"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  admin-host:
    build:
      context: ../..
      dockerfile: deploy/frontend.Dockerfile
      additional_contexts: {platform-packages: ../../../../liveshop-platform/business/packages}
      args: {WORKSPACE: "@liveshop/app-admin", SOURCE_DIR: frontend-admin}
    ports: ["127.0.0.1:15173:18080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [gateway]

  merch-host:
    build:
      context: ../..
      dockerfile: deploy/frontend.Dockerfile
      additional_contexts: {platform-packages: ../../../../liveshop-platform/business/packages}
      args: {WORKSPACE: "@liveshop/app-merch", SOURCE_DIR: frontend-merch}
    ports: ["127.0.0.1:15174:18080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [gateway]

  shop-host:
    build:
      context: ../..
      dockerfile: deploy/frontend.Dockerfile
      additional_contexts: {platform-packages: ../../../../liveshop-platform/business/packages}
      args: {WORKSPACE: "@liveshop/app-shop", SOURCE_DIR: frontend-shop}
    ports: ["127.0.0.1:15175:18080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [gateway]

  live-host:
    build:
      context: ../..
      dockerfile: deploy/frontend.Dockerfile
      additional_contexts: {platform-packages: ../../../../liveshop-platform/business/packages}
      args: {WORKSPACE: "@liveshop/app-live", SOURCE_DIR: frontend-live}
    ports: ["127.0.0.1:15176:18080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [gateway]

networks:
  default:
    name: liveshop-local
    external: true
