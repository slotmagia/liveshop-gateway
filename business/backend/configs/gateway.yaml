# Local development configuration. Every value the process needs is here:
# Gateway reads no environment variable and applies no code default.
service: gateway

log:
  level: info
  format: text

server:
  http: ":18081"

identity:
  origin_url: "http://127.0.0.1:18092"

platform:
  registry_url: "http://127.0.0.1:18070"

# Public verification key of the Identity Module Capability issuer.
module_capability:
  key_id: module-capability-dev-1
  public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
  issuer: liveshop-identity

# Gateway's own workload identity, presented to Registry internal endpoints.
workload_identity:
  key_id: gateway-workload-dev-1
  private_key: k51SIJI3oT-PJGXf2uWjL6jyTiDJ1Nwmk6l1ehqDrqA
  issuer: liveshop-workload-identity

http:
  # Every browser origin belongs to exactly one security surface. Do not merge
  # this back into a flat allowlist: credentialed /auth refresh is same-origin
  # at Gateway and must not be callable across Admin/Merchant surfaces.
  surface_origins:
    admin:
      - http://127.0.0.1:15173
      - http://192.168.5.140:15173
      - http://127.0.0.1:15177
      - http://192.168.5.140:15177
      - http://127.0.0.1:15180
      - http://192.168.5.140:15180
      - http://127.0.0.1:15201
      - http://192.168.5.140:15201
      - http://127.0.0.1:15290
      - http://192.168.5.140:15290
      - http://127.0.0.1:15300
      - http://192.168.5.140:15300
    merch:
      - http://127.0.0.1:15174
      - http://192.168.5.140:15174
      - http://127.0.0.1:15191
      - http://192.168.5.140:15191
      - http://127.0.0.1:15195
      - http://192.168.5.140:15195
      - http://127.0.0.1:15202
      - http://192.168.5.140:15202
      - http://127.0.0.1:15291
      - http://192.168.5.140:15291
      - http://127.0.0.1:15301
      - http://192.168.5.140:15301
    shop:
      - http://127.0.0.1:15175
      - http://192.168.5.140:15175
      - http://127.0.0.1:15192
      - http://192.168.5.140:15192
      - http://127.0.0.1:15203
      - http://192.168.5.140:15203
      - http://127.0.0.1:15292
      - http://192.168.5.140:15292
      - http://127.0.0.1:15302
      - http://192.168.5.140:15302
    live:
      - http://127.0.0.1:15176
      - http://192.168.5.140:15176
      - http://127.0.0.1:15204
      - http://192.168.5.140:15204
      - http://127.0.0.1:15303
      - http://192.168.5.140:15303

route_refresh:
  interval: 5s
  timeout: 3s
  max_staleness: 30s
